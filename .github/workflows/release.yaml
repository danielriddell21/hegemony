name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    # ubuntu, where the GoReleaser job needed macos: the GUI build no longer
    # uses cgo, so there is no darwin toolchain to have natively.
    uses: danielriddell21/github-actions/.github/workflows/release.yaml@v2
    permissions:
      contents: write
    with:
      # The headless build's formula comes from letsgo.mod's brew directive.
      # This is the other half: the gui variant's archives, as a cask.
      cask-name: hegemony
      cask-variant: gui
      cask-desc: A territory-war simulation where competing algorithms fight to control a shared grid
      cask-caveats: >-
        The hegemony board opens an Ebiten window and is macOS-only; on Linux/Windows install the formula and run in the terminal.
    secrets:
      tap-app-private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
